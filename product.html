<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>מוצר · אדונית התבלינים · הדמיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap">
<link rel="icon" href="assets/img/site/logo.png">
<link rel="stylesheet" href="assets/css/site.css">
<style>
.pd{display:flex;flex-wrap:wrap;gap:36px;padding-block:20px 40px}
.pd-img{flex:1 1 420px;min-width:0;background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);aspect-ratio:1/1;max-height:560px;display:grid;place-items:center;overflow:hidden}
.pd-img img{width:100%;height:100%;object-fit:contain}
.pd-info{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{min-height:60px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 15px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt small{font-weight:400;color:var(--muted)}
.note{background:var(--soft);border-radius:16px;padding:14px 16px;font-size:15px}
</style>
</head>
<body>
<main class="wrap">
  <nav class="crumbs" aria-label="פירורי לחם" style="padding-top:20px"><a href="index.html">דף הבית</a><span>›</span><a id="cat-link" href="#"></a><span>›</span><span id="crumb"></span></nav>
  <div class="pd" data-pd>
    <div class="pd-img"><img id="pimg" alt=""></div>
    <div class="pd-info">
      <div class="chips" id="tags"></div>
      <h1 id="pname" style="font-size:clamp(28px,3.5vw,40px)"></h1>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="price" id="pprice" style="font-size:34px"></span><span class="unit" id="punit" style="font-size:15px"></span></div>

      <div id="mode-box">
        <b style="display:block;margin-bottom:8px">איך לקנות?</b>
        <div class="opts" id="modes"></div>
      </div>
      <div id="weight-box">
        <b style="display:block;margin-bottom:8px">כמה?</b>
        <div class="qty"><button type="button" id="minus" aria-label="פחות">−</button><output id="qty"></output><button type="button" id="plus" aria-label="יותר">+</button></div>
      </div>
      <div data-plug="unitprice"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn pri" id="add" style="flex:1 1 200px">הוספה לעגלה</button>
        <button class="btn sec" id="fixed">הוספה להזמנה הקבועה</button>
        <button class="btn sec" id="favbtn" aria-pressed="false">שמירה במועדפים</button>
      </div>
      <div data-plug="subs,wishlist"></div>

      <div class="note" id="bulk-note"><b>החיוב רק אחרי הליקוט.</b> במוצרים במשקל המחיר בעגלה הוא הערכה. אנחנו שוקלים, ומחייבים לפי המשקל האמיתי. <span data-plug="j5"></span></div>
      <div class="note" id="club-note" style="background:var(--gold-soft)"><b>5% חוזרים לארנק המועדון</b> על המוצר הזה, כי הוא נמכר בתפזורת. <span data-plug="wallet"></span></div>
      <div class="note"><b>משלוח:</b> עד 5 ימי עסקים. 40 ₪ עד 20 ק"ג, חינם מעל 450 ₪. <a href="help.html#shipping">בדיקת משלוח לעיר שלכם</a></div>
    </div>
  </div>

  <section class="sec" style="padding-top:0">
    <div class="sec-head"><div class="t"><h2>מתכון עם המוצר</h2></div></div>
    <div class="grid g3" id="recipes"></div>
  </section>
  <section class="sec" style="padding-top:0">
    <div class="sec-head"><div class="t"><h2>קונים יחד עם המוצר</h2></div><div data-plug="core"></div></div>
    <div class="grid g4" id="related"></div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/recipes.js"></script>
<script>
window.pageInit = function () {
  const id = new URLSearchParams(location.search).get('id');
  const p = productById(id) || productsIn(['pure'])[0];
  const bulk = isBulk(p);
  const catKey = p.cats.find(c => CATS[c] && c !== 'sale') || p.cats[0];
  document.title = p.name + ' · אדונית התבלינים · הדמיה';
  document.getElementById('pimg').src = p.img; document.getElementById('pimg').alt = p.name;
  document.getElementById('pname').textContent = p.name;
  document.getElementById('crumb').textContent = p.name;
  const cl = document.getElementById('cat-link'); cl.textContent = CATS[catKey]; cl.href = 'category.html?c=' + catKey;
  const tags = [];
  if (p.cats.includes('pure') || p.cats.includes('blends')) tags.push('<span class="tag green">מתוצרת אדונית · טוחנים במקום</span>');
  ['organic', 'gf', 'vegan', 'keto', 'sugarfree'].forEach(k => { if (p.cats.includes(k)) tags.push(`<span class="tag">${CATS[k]}</span>`); });
  if (p.cats.includes('sale')) tags.push('<span class="tag red">מבצע</span>');
  document.getElementById('tags').innerHTML = tags.join('');
  let mode = 'unit', q = 1;
  const modes = document.getElementById('modes');
  if (!bulk) { document.getElementById('mode-box').hidden = true; document.getElementById('bulk-note').hidden = true; document.getElementById('club-note').hidden = true; }
  function draw() {
    const kg = mode === 'kg';
    const total = kg ? p.price / p.g * 1000 * q : p.price * q;
    document.getElementById('pprice').textContent = money(total);
    document.getElementById('punit').innerHTML = p.g ? `${money(p.price / p.g * 100)} ל-100 גרם · ${money(p.price / p.g * 1000)} לק"ג` : '';
    document.getElementById('qty').textContent = kg ? q + ' ק"ג' : q + ' יח\'';
    if (bulk) modes.innerHTML = [['unit', 'יחידות', `אריזה של ${p.g >= 1000 ? p.g / 1000 + ' ק"ג' : p.g + ' גרם'}`], ['kg', 'לפי ק"ג', 'שוקלים בשבילכם']].map(([k, t, s]) => `<button type="button" class="opt" data-m="${k}" aria-pressed="${k === mode}">${t}<small>${s}</small></button>`).join('');
  }
  modes.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m; q = mode === 'kg' ? 0.25 : 1; draw(); });
  document.getElementById('plus').onclick = () => { q = +(q + (mode === 'kg' ? 0.25 : 1)).toFixed(2); draw(); };
  document.getElementById('minus').onclick = () => { q = Math.max(mode === 'kg' ? 0.25 : 1, +(q - (mode === 'kg' ? 0.25 : 1)).toFixed(2)); draw(); };
  document.getElementById('add').onclick = () => addToCart(p.id, mode, q);
  document.getElementById('fixed').onclick = () => { const f = demoStore.get('fixed', []); if (!f.includes(p.id)) f.push(p.id); demoStore.set('fixed', f); demoToast('נוסף להזמנה הקבועה'); };
  const fb = document.getElementById('favbtn');
  const syncFav = () => { const on = demoStore.get('favs', []).includes(p.id); fb.setAttribute('aria-pressed', on); fb.textContent = on ? 'שמור במועדפים ✓' : 'שמירה במועדפים'; };
  fb.onclick = () => { let f = demoStore.get('favs', []); f = f.includes(p.id) ? f.filter(x => x !== p.id) : f.concat(p.id); demoStore.set('favs', f); syncFav(); renderFavCount(); };
  syncFav(); draw();
  const word = p.name.split(/[\s-]/)[0];
  let rs = RECIPES.filter(r => r.find.some(w => p.name.includes(w)));
  if (!rs.length) rs = RECIPES.slice(3, 4);
  document.getElementById('recipes').innerHTML = rs.slice(0, 3).map(recipeCard).join('');
  document.getElementById('related').innerHTML = productsIn([catKey]).filter(x => x.id !== p.id).slice(0, 4).map(x => productCard(x)).join('');
};
</script>
</body>
</html>
